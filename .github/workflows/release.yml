# Publish to PyPI via Trusted Publishing (OIDC) — no token, no secret, no 2FA.
#
# 🚨 **仓库拆分后必须回 PyPI 重指信任关系。**
#
# 0.1.0 是从**老组织**的 monorepo 发出去的
# （`song-finder-free/longform-memory`，workflow `release-python.yml`）——
# 这是历史事实，别把它跟着仓库迁移一起改掉，PyPI 上那条正式 publisher
# 现在钉的就是那个位置。
# 代码搬到本仓库之后，**必须在 PyPI 的「项目」设置页**（不是账号侧栏，
# 项目已经存在了）再加一条：
#
#   Owner            : emberspun
#   Repository name  : longform-memory-python
#   Workflow name    : release.yml        ← 必须与本文件名一字不差
#   Environment name : （留空）
#
# 不加的话，下一次发版会被 PyPI 直接拒 —— 而那时 tag 已经推出去了。
# 旧的那条可以留着，不冲突。
#
# 发布：
#   （改 pyproject.toml 的 version）
#   git tag v0.1.1 && git push --tags
#
# 其余硬要求：
#   - `id-token: write` 少了这一行，OIDC 换不到凭据
#   - 不声明 `environment:` —— PyPI 上配的是 (Any)，声明一个仓库里不存在的
#     environment 只是多一个失败点（旧仓库首发时就是这么排掉的）

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tag 与 pyproject 必须说同一个版本号。
      # 不校验的话，打错 tag 会发出意外版本，而发出去撤不回来。
      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG=${GITHUB_REF_NAME#v}
          echo "pyproject=$PKG  tag=$TAG"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag v$TAG 与 pyproject $PKG 不一致"; exit 1; }

      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          # twine check 用的是 PyPI 拒绝上传时的同一套规则，先在这儿红比线上红好
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # ← OIDC 的命门
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # 不设任何 token：凭据由 OIDC 现换
      - uses: pypa/gh-action-pypi-publish@release/v1
